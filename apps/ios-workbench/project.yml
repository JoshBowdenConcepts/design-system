name: iOSComponentWorkbench
options:
  deploymentTarget:
    iOS: "15.0"
# Signing applies to every target so a regenerated project is runnable on a
# device without reconfiguring Signing & Capabilities by hand each time —
# XcodeGen rewrites the .xcodeproj from this spec, so anything set in Xcode's
# UI is lost on the next `pnpm ios:workbench`.
settings:
  base:
    DEVELOPMENT_TEAM: R4959LNU8F
    CODE_SIGN_STYLE: Automatic
packages:
  design-system:
    path: ../..
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.18.0
targets:
  iOSComponentWorkbench:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: design-system
        product: DesignSystemComponents
      - package: design-system
        product: DesignSystemTokens
      - package: design-system
        product: DesignSystemIcons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designsystem.workbench
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: 5.0
  iOSComponentWorkbenchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../../packages/components/tests/ios
      - path: ../../packages/tokens/tests/ios
    dependencies:
      - target: iOSComponentWorkbench
      - package: design-system
        product: DesignSystemComponents
      - package: design-system
        product: DesignSystemTokens
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designsystem.workbench.tests
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: 5.0
  iOSComponentWorkbenchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: iOSComponentWorkbench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designsystem.workbench.uitests
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: 5.0
schemes:
  iOSComponentWorkbench:
    build:
      targets:
        iOSComponentWorkbench: all
        iOSComponentWorkbenchTests: [test]
        iOSComponentWorkbenchUITests: [test]
    test:
      targets:
        - iOSComponentWorkbenchTests
        - iOSComponentWorkbenchUITests
